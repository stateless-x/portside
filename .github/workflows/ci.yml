name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust tests and lints
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test
        # Ignored tests probe live processes/ports on the runner and are
        # machine-specific by design (see src-tauri/tests) — not run in CI.
        run: cargo test
      - name: Clippy
        run: cargo clippy -- -D warnings
